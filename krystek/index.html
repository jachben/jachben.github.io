<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabulka střihu</title>
<meta name="description" content="2 videí · 750 Kč">
<meta name="theme-color" content="#0b1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="krystek.kuba">
<meta property="og:title" content="krystek.kuba">
<meta property="og:description" content="2 videí · 750 Kč">
<meta property="og:url" content="https://jachben.github.io/krystek/">
<meta property="og:image" content="https://jachben.github.io/ikony/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="/ikony/favicon.png">
<link rel="apple-touch-icon" href="/ikony/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#0c0f1d; --ink-2:#2b3045; --muted:#6b7186; --faint:#9aa0b4;
  --line:#e5e7ef; --line-2:#eef0f5;
  --accent:#4f5bf2; --accent-2:#7c4dff; --accent-ink:#fff; --accent-soft:#eceefe;
  --ok:#14955f; --ok-soft:#e3f6ec; --warn:#b26a00; --warn-soft:#fff3dc; --danger:#d23f4a; --danger-soft:#fdecee;
  --hero-1:#0b1030; --hero-2:#1d2a78; --hero-3:#5b3fd6;
  --shadow-sm:0 1px 2px rgba(16,20,40,.06);
  --shadow:0 1px 2px rgba(16,20,40,.05),0 12px 32px -12px rgba(16,20,40,.12);
  --shadow-lg:0 30px 80px -20px rgba(12,15,40,.35);
  --r:18px; --r-sm:12px;
  --mono:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07080f; --surface:#10121d; --surface-2:#151827; --ink:#eef0f8; --ink-2:#cdd1e2; --muted:#8e94ab; --faint:#666c84;
    --line:#22263a; --line-2:#1a1d2d;
    --accent:#8790ff; --accent-2:#a98bff; --accent-ink:#0b0d1a; --accent-soft:#1d2142;
    --ok:#4fd39a; --ok-soft:#10291f; --warn:#f0b454; --warn-soft:#2b210f; --danger:#ff7c86; --danger-soft:#2d1418;
    --hero-1:#0a0d24; --hero-2:#18216a; --hero-3:#4b32b8;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:0 0 calc(48px + env(safe-area-inset-bottom));min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,.money{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg{flex:none}

/* horní lišta */
.top{position:sticky;top:0;z-index:30;backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  padding:env(safe-area-inset-top) 0 0}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;min-width:0}
.brand img{width:30px;height:30px;border-radius:8px;box-shadow:var(--shadow-sm)}
.brand span{overflow:hidden;text-overflow:ellipsis}
.top-acts{margin-left:auto;display:flex;align-items:center;gap:8px}

.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 0;display:flex;flex-direction:column;gap:18px}

/* tlačítka */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:11px;padding:9px 14px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;
  box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.iconbtn:focus-visible,.row-play:focus-visible,.card:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:16px;height:16px}
.btn.primary{background:linear-gradient(135deg,#4f5bf2,#7c4dff);border-color:transparent;color:#fff;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.iconbtn.del:hover{color:var(--danger);background:var(--danger-soft)}
.iconbtn svg{width:17px;height:17px}

/* stav zveřejnění */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.busy{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.busy i{animation:pulse 1s ease-in-out infinite}
.pill.err{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.pill.live i{box-shadow:0 0 0 0 currentColor;animation:ring 2.4s infinite}
@keyframes pulse{50%{opacity:.3}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;color:#fff;padding:30px 30px 26px;
  background:radial-gradient(120% 140% at 100% 0%,var(--hero-3) 0%,transparent 55%),radial-gradient(90% 120% at 0% 100%,#0e6b8f55 0%,transparent 60%),linear-gradient(140deg,var(--hero-1),var(--hero-2));
  box-shadow:var(--shadow-lg)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(120deg,transparent 30%,#000 100%);-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000 100%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.7}
.hero h1{margin:8px 0 0;font-size:clamp(28px,5.4vw,46px);line-height:1.05;letter-spacing:-.035em;font-weight:700}
.hero h1 input{all:unset;width:100%;font:inherit;letter-spacing:inherit;border-radius:10px;padding:2px 6px;margin-left:-6px;cursor:text}
.hero h1 input:hover{background:rgba(255,255,255,.08)}
.hero h1 input:focus{background:rgba(255,255,255,.12);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.78)}
.hero-meta b{color:#fff;font-weight:500}
.hero-meta label{display:flex;align-items:center;gap:6px}
.hero-meta input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:4px 8px;width:150px;outline:none}
.hero-meta input::placeholder{color:rgba(255,255,255,.45)}
.hero-meta input:focus{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.16)}
.hero-total{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:28px}
.big{font-family:var(--mono);font-weight:600;font-size:clamp(34px,7vw,58px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big small{font-size:.42em;letter-spacing:0;opacity:.7;margin-left:6px;font-family:Geist,sans-serif;font-weight:500}
.big-lbl{font-size:12.5px;color:rgba(255,255,255,.7);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;min-width:120px}
.chip b{display:block;font-family:var(--mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.chip span{font-size:12px;color:rgba(255,255,255,.7)}

/* přepínač */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:4px;gap:2px;box-shadow:var(--shadow-sm);align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer;display:flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg svg{width:16px;height:16px}
.seg .cnt{font-family:var(--mono);font-size:12px;opacity:.7}

/* skupiny a řádky */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.ghead h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.ghead h2 .badge{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.ghead .money{font-weight:500;color:var(--ink-2)}
.rows{list-style:none;margin:0;padding:0}
.vrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line-2);transition:background .12s}
.vrow:last-child{border-bottom:0}
.vrow.has-video{cursor:pointer}
.vrow.has-video:hover{background:var(--surface-2)}
.thumb{position:relative;width:76px;height:44px;border-radius:9px;overflow:hidden;flex:none;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface-2)),color-mix(in srgb,var(--accent-2) 16%,var(--surface-2)));display:grid;place-items:center;color:var(--accent);border:1px solid var(--line)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .n{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.thumb .play{position:relative;width:26px;height:26px;border-radius:50%;background:rgba(10,12,25,.62);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .15s}
.thumb .play svg{width:12px;height:12px;margin-left:2px}
.vrow.has-video:hover .play{transform:scale(1.12)}
.thumb.empty{background:var(--surface-2)}
.vname{min-width:0}
.vname b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vname span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.vname span svg{width:12px;height:12px}
.vprice{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.gempty{padding:28px 20px;text-align:center;color:var(--muted);font-size:14px}

/* editor řádek */
.erow{display:grid;grid-template-columns:44px minmax(0,1.3fr) minmax(0,1fr) 110px 36px;align-items:center;gap:8px;padding:6px 14px 6px 20px;border-bottom:1px solid var(--line-2)}
.erow:last-child{border-bottom:0}
.erow:hover{background:var(--surface-2)}
.erow .thumb{width:44px;height:30px;border-radius:7px;cursor:default}
.erow .thumb.click{cursor:pointer}
.erow .thumb .play{width:20px;height:20px}
.erow .thumb .play svg{width:9px;height:9px}
.field{width:100%;border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 9px;outline:none;min-width:0}
.field:hover{border-color:var(--line)}
.field:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.field.url{font-size:13px;color:var(--muted)}
.field.url:focus{color:var(--ink)}
.field.price{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.urlwrap{position:relative;display:flex;align-items:center}
.urlwrap svg{position:absolute;left:9px;width:14px;height:14px;color:var(--faint);pointer-events:none}
.urlwrap .field{padding-left:29px}

/* přidání */
.add{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 110px auto;gap:8px;padding:14px 20px;background:var(--surface-2);border-top:1px solid var(--line)}
.add .field{background:var(--surface);border-color:var(--line)}
.bulk{padding:0 20px 14px;background:var(--surface-2)}
.bulk summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 0;list-style:none;display:inline-flex;gap:6px;align-items:center}
.bulk summary::-webkit-details-marker{display:none}
.bulk summary:hover{color:var(--ink)}
.bulk textarea{width:100%;min-height:110px;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font:13px/1.55 var(--mono);outline:none;resize:vertical}
.bulk textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bulk .acts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* panely a karty */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 4px;font-size:15px;font-weight:600}
.panel p{margin:0;color:var(--muted);font-size:13.5px;max-width:560px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.section-head h2{margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600}
.section-head span{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow),0 16px 40px -18px color-mix(in srgb,var(--accent) 45%,transparent)}
.card .ct{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.card .mark.arch{background:linear-gradient(135deg,#0f766e,#0e7490)}
.card .amount{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.card .amount small{font-size:13px;font-family:Geist,sans-serif;color:var(--muted);letter-spacing:0;margin-left:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line-2);padding-top:12px;margin-top:auto}
.card .acts .iconbtn{margin-left:auto}
.newcard{border-style:dashed;background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);min-height:190px;font-weight:500}
.newcard:hover{color:var(--accent)}
.newcard .plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:8px}
.page-head h1{margin:4px 0 0;font-size:clamp(28px,5vw,40px);letter-spacing:-.035em;line-height:1.05}
.page-head .eyebrow{color:var(--muted);opacity:1}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1}

.footer-total{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ink);color:var(--surface);border-radius:var(--r);padding:20px 24px;box-shadow:var(--shadow-lg)}
.footer-total .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.7}
.footer-total .money{font-size:clamp(24px,5vw,32px);font-weight:500;letter-spacing:-.03em}
.updated{display:flex;justify-content:center;color:var(--muted);font-size:12.5px;gap:6px;align-items:center}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state h2{color:var(--ink);margin:0 0 6px;font-size:20px}

/* dialogy */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:100vw;max-height:100vh}
dialog::backdrop{background:rgba(5,7,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.player{width:min(960px,calc(100vw - 24px))}
.player.vert{width:min(420px,calc(100vw - 24px))}
.player-top{display:flex;align-items:center;gap:10px;color:#fff;padding:0 2px 10px}
.player-top b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.player-top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.player-top .btn:hover{background:rgba(255,255,255,.2)}
.player-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg)}
.player.vert .player-box{aspect-ratio:9/16;max-height:calc(100vh - 110px);margin:0 auto}
.player-box iframe,.player-box video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.player-box .ext{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:24px;gap:14px;align-content:center}
.sheet{width:min(460px,calc(100vw - 24px));background:var(--surface);border-radius:22px;padding:24px;box-shadow:var(--shadow-lg)}
.sheet h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.sheet p{margin:0 0 14px;color:var(--muted)}
.sheet ol{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.sheet li{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.sheet li .stepn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.sheet li svg{width:18px;height:18px;color:var(--accent);vertical-align:-3px}
.sheet textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px;font:13px/1.5 var(--mono);resize:vertical}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .hero{padding:24px 20px 20px;border-radius:20px}
  .hero-total{margin-top:22px}
  .chip{min-width:0;flex:1}
  .vrow{padding:10px 14px;gap:12px}
  .thumb{width:64px;height:38px}
  .ghead{padding:14px}
  .erow{grid-template-columns:36px minmax(0,1fr) 92px 32px;grid-template-areas:"t n p d" "t u u d";padding:8px 10px;row-gap:2px}
  .erow .thumb{grid-area:t;width:36px;height:26px;align-self:start;margin-top:6px}
  .erow .n{grid-area:n}.erow .urlwrap{grid-area:u}.erow .p{grid-area:p}.erow .iconbtn{grid-area:d;align-self:start}
  .add{grid-template-columns:1fr 100px;padding:12px 14px}
  .add .urlwrap{grid-column:1/-1;order:2}
  .add .btn{grid-column:1/-1;order:3}
  .bulk{padding:0 14px 12px}
  .brand .full{display:none}
  .top-acts .btn .lbl{display:none}
  .footer-total{padding:16px 18px}
}
@media print{
  body{background:#fff;color:#000}
  .top,.seg,.panel,.add,.bulk,.toolbar,.iconbtn,.card .acts,.updated{display:none!important}
  .hero{box-shadow:none;color:#000;background:#fff;border:1px solid #ddd}
  .hero::after{display:none}
  .hero-meta,.big-lbl,.chip span{color:#444}
  .chip{border-color:#ddd}
  .group,.footer-total{box-shadow:none;break-inside:avoid}
  .footer-total{background:#fff;color:#000;border:2px solid #000}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  var ui = { openId: null, archId: null, tab: null };

  function refreshClient(force){
    if (!force && Date.now() - lastFetch < 15000) return;
    lastFetch = Date.now();

      var fresh = normalize(d), thumbs = d.thumbs || {}, noembed = d.noembed || [];
      if (JSON.stringify(fresh) === JSON.stringify(state) && JSON.stringify(thumbs) === JSON.stringify(THUMBS) && JSON.stringify(noembed) === JSON.stringify(NOEMBED)) return;

  function installHelp(){

  // ================= EDITOR =================

        '<div class="amount">' + (all.length ? num(sum(all)) : '0') + '<small>' + esc(t.currency) + '</small></div>' +

  function editRow(t, g, gi, it, i){
    return '<div class="erow">' + thumbHtml(it, i + 1, true).replace('<div class="thumb', '<div data-g="' + gi + '" data-i="' + i + '" class="thumb') +
      '<input class="field n" id="n-' + gi + '-' + i + '" data-g="' + gi + '" data-i="' + i + '" data-f="name" value="' + esc(it.name) + '" placeholder="Název videa" aria-label="Název videa">' +

      '<input class="field price p" id="p-' + gi + '-' + i + '" data-g="' + gi + '" data-i="' + i + '" data-f="price" value="' + esc(it.price) + '" inputmode="decimal" placeholder="Cena" aria-label="Cena">' +
      '<button class="iconbtn del" type="button" data-del="' + gi + '-' + i + '" title="Smazat" aria-label="Smazat ' + esc(it.name) + '">' + I.x + '</button></div>';

  function renderEditTable(t){
    var all = itemsOf(t.groups), n = all.length;
    var h = '<div class="toolbar"><button class="btn" type="button" id="home">' + I.back + 'Všechny tabulky</button><span class="grow"></span>' +
      (t.shareUrl ? '<button class="btn primary" type="button" data-link="' + t.id + '">' + I.link + 'Kopírovat odkaz</button>' +

      '<button class="btn" type="button" id="sharetext">' + I.copy + '<span>Text</span></button>' +
      '<button class="btn" type="button" id="pdf">' + I.print + '<span>PDF</span></button></div>';
    h += hero(t, t.groups, { eyebrow: 'Přehled práce', editName: true, totalLabel: 'Celkem k úhradě' });

    t.groups.forEach(function(g, gi){
      h += '<section class="group"><div class="ghead"><h2>' + esc(g.label) + ' <span class="badge">' + g.items.length + '</span></h2><span class="money">' + (g.items.length ? money(t, sum(g.items)) : '') + '</span></div>';
      h += g.items.length ? g.items.map(function(it, i){ return editRow(t, g, gi, it, i); }).join('') : '<div class="gempty">Zatím žádná videa</div>';
      h += '<div class="add"><input class="field" id="new-name-' + gi + '" data-add="' + gi + '" placeholder="Název nového videa" aria-label="Název nového videa">' +
        '<div class="urlwrap">' + I.link + '<input class="field" id="new-url-' + gi + '" data-add="' + gi + '" placeholder="Odkaz na video (nepovinné)" aria-label="Odkaz na nové video" inputmode="url"></div>' +
        '<input class="field price" id="new-price-' + gi + '" data-add="' + gi + '" inputmode="decimal" placeholder="Cena" aria-label="Cena nového videa" value="' + esc(lastPrice(g)) + '">' +
        '<button class="btn primary" type="button" data-addbtn="' + gi + '">' + I.plus + 'Přidat</button></div>' +
        '<details class="bulk"><summary>' + I.list.replace('<svg', '<svg width="14" height="14"') + 'Přidat víc videí najednou</summary>' +
        '<textarea id="bulk-' + gi + '" placeholder="Day 272 – 200&#10;Day 273 – 200 – https://youtu.be/…&#10;vlog Brno – 800"></textarea>' +
        '<div class="acts"><span class="hint">Jedno video na řádek: název – cena – odkaz (cena a odkaz nepovinné)</span><button class="btn sm" type="button" data-bulk="' + gi + '">Přidat všechny</button></div></details></section>';
    });

    h += '<div class="footer-total"><span class="lbl">Celkem k úhradě</span><span class="money">' + (n ? money(t, sum(all)) : '—') + '</span></div>';
    h += '<div class="panel"><div><h3>Uzavřít měsíc</h3><p>Videa se přesunou do historie <b>' + esc(monthLabel()) + '</b> a tabulka začne od nuly. Klient uvidí uzavřený měsíc v záložce Historie.</p></div>' +
      '<button class="btn primary" type="button" id="archive"' + (n ? '' : ' disabled') + '>' + I.archive + 'Uzavřít ' + n + ' ' + videos(n) + '</button></div>';
    if (t.archives.length) {
      h += '<div class="section-head"><h2>Historie</h2><span>' + t.archives.length + ' ' + months(t.archives.length) + '</span></div>' + archiveCards(t, true);

  function lastPrice(g){ for (var i = g.items.length - 1; i >= 0; i--) if (g.items[i].price !== '') return g.items[i].price; return ''; }

  function touch(t){ if (t) t.updatedAt = Date.now(); }

  function save(now){
    clearTimeout(saveTimer);
    function go(){
      fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) })
        .then(function(r){ return r.json(); }).then(applyStatus).catch(function(){ pub.state = 'offline'; renderTop(); });
    }
    pub.state = 'pending'; renderTop();
    if (now) go(); else saveTimer = setTimeout(go, 500);
  }

  function applyStatus(s){
    if (!s) return;
    pub.state = s.state; pub.at = s.at ? s.at * 1000 : 0; pub.error = s.error || '';
    var changed = false;
    if (s.thumbs && JSON.stringify(s.thumbs) !== JSON.stringify(THUMBS)) { THUMBS = s.thumbs; changed = true; }
    if (s.noembed && JSON.stringify(s.noembed) !== JSON.stringify(NOEMBED)) { NOEMBED = s.noembed; changed = true; }
    (s.links || []).forEach(function(l){
      var t = findTable(l.id);
      if (t && (t.shareUrl !== l.shareUrl || t.sitePath !== l.sitePath)) { t.shareUrl = l.shareUrl; t.sitePath = l.sitePath; changed = true; }
    });
    if (changed) scheduleRender(true); else renderTop();
    clearTimeout(pollT);
    pollT = setTimeout(poll, pub.state === 'ok' || pub.state === 'error' ? 15000 : 2000);
  }
  var pollT;
  function poll(){ fetch('/status', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(applyStatus).catch(function(){ pub.state = 'offline'; renderTop(); pollT = setTimeout(poll, 5000); }); }

  function scheduleRender(now){ clearTimeout(renderTimer); if (now) render(); else renderTimer = setTimeout(render, 350); }

  function addOne(gi){
    var t = findTable(ui.openId); if (!t) return;
    var ni = document.getElementById('new-name-' + gi), ui2 = document.getElementById('new-url-' + gi), pi = document.getElementById('new-price-' + gi);
    var name = ni.value.trim();
    if (!name) { ni.focus(); toast('Napište název videa'); return; }
    t.groups[gi].items.push({ name: name, url: ui2.value.trim(), price: pi.value.trim() === '' ? '' : parsePrice(pi.value) });
    touch(t); save(); render();
    var again = document.getElementById('new-name-' + gi); if (again) again.focus();
  }

  function addBulk(gi){
    var t = findTable(ui.openId), ta = document.getElementById('bulk-' + gi), added = 0;
    ta.value.split(/\n/).forEach(function(l){
      l = l.trim(); if (!l) return;
      var url = '', m = l.match(/(https?:\/\/\S+|www\.\S+)/i);
      if (m) { url = m[1]; l = l.replace(m[1], '').trim(); }
      l = l.replace(/[\s–—-]+$/, '').trim();
      var pm = l.match(/^(.*?)[\s:–—-]+(\d[\d\s]*(?:[.,]\d+)?)\s*(?:kč|czk)?$/i);
      if (pm && pm[1].trim()) t.groups[gi].items.push({ name: pm[1].trim(), price: parsePrice(pm[2]), url: url });
      else if (l) t.groups[gi].items.push({ name: l, price: lastPrice(t.groups[gi]), url: url });
      else return;
      added++;
    });
    if (!added) { toast('Nic k přidání'); return; }
    touch(t); save(); render(); toast('Přidáno ' + added + ' ' + videos(added));
  }

  function closeMonth(t){
    var all = itemsOf(t.groups); if (!all.length) return;
    var label = monthLabel(), same = t.archives.filter(function(a){ return a.label.indexOf(label) === 0; }).length;
    if (same) label += ' (' + (same + 1) + ')';
    if (!confirm('Přesunout ' + all.length + ' ' + videos(all.length) + ' do historie „' + label + '“? Tabulka začne od nuly.')) return;
    t.archives.unshift({ id: uid('a'), label: label, closedAt: Date.now(), groups: clone(t.groups) });
    t.groups.forEach(function(g){ g.items = []; });
    touch(t); save(true); render(); toast('Měsíc uzavřen — najdete ho v historii');
  }

  // ================= vykreslení =================

  function renderTop(){ document.getElementById('top').innerHTML = EDIT ? editorTop() : clientTop(state.tables[0]); }

  function render(){
    if (!EDIT) { renderClient(); return; }
    var act = document.activeElement, aid = act && act.id, s1 = null, s2 = null;
    try { if (aid) { s1 = act.selectionStart; s2 = act.selectionEnd; } } catch (e) {}
    renderTop();
    var t = findTable(ui.openId), a = findArch(t, ui.archId), root = document.getElementById('root');
    root.innerHTML = a ? archiveView(t, a) : (t ? renderEditTable(t) : renderHome());

    if (aid) { var el = document.getElementById(aid); if (el) { el.focus({ preventScroll: true }); try { if (s1 != null) el.setSelectionRange(s1, s2); } catch (e) {} } }
  }

  function go(fn){ fn(); render(); window.scrollTo(0, 0); }
  function openTable(id){ go(function(){ ui.openId = id; ui.archId = null; try { sessionStorage.setItem('open', id); } catch (e) {} }); }

  // ================= události =================

  var root = document.getElementById('root');

  root.addEventListener('input', function(e){
    if (!EDIT) return;
    var el = e.target, t = findTable(ui.openId); if (!t) return;
    if (el.dataset.f) {
      var it = t.groups[+el.dataset.g].items[+el.dataset.i];
      if (el.dataset.f === 'price') it.price = el.value.trim() === '' ? '' : parsePrice(el.value); else it[el.dataset.f] = el.value;
    } else if (el.dataset.meta) t[el.dataset.meta] = el.value;
    else return;
    touch(t); save(); scheduleRender();
  });

  root.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    if (e.target.dataset.add != null) { e.preventDefault(); addOne(+e.target.dataset.add); return; }
    var r = e.target.closest('[data-video],[data-open],[data-arch]');
    if (r && r === e.target) { e.preventDefault(); r.click(); }
  });

  root.addEventListener('click', function(e){
    var t = findTable(ui.openId) || (!EDIT ? state.tables[0] : null);
    var b = e.target.closest('button,[data-video],[data-open],[data-arch],[data-play]');
    if (!b || b.tagName === 'A') return;
    var d = b.dataset;
    if (d.tab) { ui.tab = d.tab; render(); return; }
    if (d.delArch && t) {
      var da = findArch(t, d.delArch);
      if (da && confirm('Smazat historii „' + da.label + '“? Tohle nejde vrátit.')) { t.archives = t.archives.filter(function(x){ return x !== da; }); touch(t); save(true); render(); }
      return;
    }
    if (d.arch) { go(function(){ ui.archId = d.arch; }); return; }
    if (d.backArch != null) { go(function(){ ui.archId = null; }); return; }
    if (d.copyArch && t) { var ca = findArch(t, d.copyArch); copy(summary(t, ca.groups, t.name + ' — ' + ca.label), 'Přehled zkopírován'); return; }
    if (d.video != null) {
      var g = b.closest('.group'), gi = Array.prototype.indexOf.call(root.querySelectorAll('.group'), g);
      var a = findArch(t, ui.archId), groups = a ? a.groups : t.groups;
      openPlayer(groups[gi].items[+d.video]); return;
    }
    if (!EDIT) return;
    if (d.play) { openPlayer(t.groups[+d.g].items[+d.i]); return; }
    if (d.link) { var lt = findTable(d.link); if (lt && lt.shareUrl) copy(lt.shareUrl, 'Odkaz zkopírován — pošlete ho klientovi'); return; }
    if (d.open) { openTable(d.open); return; }
    if (d.delTable) {
      var dt = findTable(d.delTable);
      if (dt && confirm('Opravdu smazat tabulku „' + dt.name + '“? Klientovi přestane fungovat odkaz.')) { state.tables = state.tables.filter(function(x){ return x !== dt; }); save(true); render(); }
      return;
    }
    if (b.id === 'new') {
      var nt = normTable({ name: 'Nová tabulka' }, state.tables.length); nt.updatedAt = Date.now();
      state.tables.push(nt); save(true); openTable(nt.id);
      setTimeout(function(){ var f = document.getElementById('f-name'); if (f) { f.focus(); f.select(); } }, 30);
      return;
    }
    if (b.id === 'home') { go(function(){ ui.openId = null; ui.archId = null; try { sessionStorage.removeItem('open'); } catch (e) {} }); return; }
    if (!t) return;
    if (b.id === 'archive') { closeMonth(t); return; }
    if (b.id === 'sharetext') { copy(summary(t, t.groups), 'Přehled zkopírován'); return; }
    if (b.id === 'pdf') { window.print(); return; }
    if (d.del) {
      var p = d.del.split('-'), it = t.groups[+p[0]].items[+p[1]];
      if (it.name && !confirm('Smazat „' + it.name + '“?')) return;
      t.groups[+p[0]].items.splice(+p[1], 1); touch(t); save(); render(); return;
    }
    if (d.addbtn != null) { addOne(+d.addbtn); return; }
    if (d.bulk != null) { addBulk(+d.bulk); return; }
  });

  document.getElementById('top').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'install') installHelp();
    if (b.id === 'publish') fetch('/publish', { method: 'POST' }).then(function(r){ return r.json(); }).then(applyStatus);
  });

  // ================= start =================

  if (EDIT) {
    try { var last = sessionStorage.getItem('open'); if (last && findTable(last)) ui.openId = last; } catch (e) {}
    render(); poll();
  } else {
    render();
    window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); installEvt = e; });
    window.addEventListener('appinstalled', function(){ isStandalone = true; renderTop(); toast('Aplikace je na ploše'); });
    if (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
      refreshClient(true);
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) refreshClient(); });
      window.addEventListener('focus', function(){ refreshClient(); });
      setInterval(function(){ if (!document.hidden) refreshClient(true); }, 60000);
    }
  }
})();
</script>
</body>
</html>
