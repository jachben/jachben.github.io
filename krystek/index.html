        return '<dt><label for="f-' + f[0] + '">' + esc(f[1]) + '</label></dt>' +
          '<dd><input id="f-' + f[0] + '" data-meta="' + f[0] + '" value="' + esc(t[f[0]]) + '" placeholder="' + esc(f[2]) + '"></dd>';
      }).join('');
    }
    return fields.filter(function(f){ return t[f[0]]; })
      .map(function(f){ return '<dt>' + esc(f[1]) + '</dt><dd>' + esc(t[f[0]]) + '</dd>'; }).join('');
  }

  function renderTable(t){
    var edit = !exporting;
    var items = tableItems(t), total = sum(items), n = items.length;
    var h = '';

    if (!exporting) {
      h += '<div class="bar">' +
        '<button id="home" type="button">' + ICON.back + 'Všechny tabulky</button>' +
        '<div class="btns">' +
        (t.shareUrl ? '<button id="link" type="button" class="primary">' + ICON.link + 'Kopírovat odkaz</button>' : '') +
        '<button id="sharetext" type="button">' + ICON.copy + 'Kopírovat text</button>' +
        '<button id="png" type="button">' + ICON.image + 'Obrázek</button>' +
        '<button id="pdf" type="button">' + ICON.print + 'PDF</button>' +
        '</div></div>';
    }

    h += '<article class="sheet"><header class="head"><div><div class="eyebrow">Přehled práce</div>' +
      (edit ? '<h1><input id="f-name" class="h1in" data-meta="name" value="' + esc(t.name) + '" placeholder="Název tabulky" aria-label="Název tabulky"></h1>'
            : '<h1>' + esc(t.name) + '</h1>') +
      '</div>' + (metaRows(t, edit) ? '<dl class="meta">' + metaRows(t, edit) + '</dl>' : '') + '</header>';

    h += '<div class="stats"><div class="stat"><b>' + n + '</b><span>' + videos(n) + ' celkem</span></div>';
    t.groups.forEach(function(g){
      h += '<div class="stat"><b>' + esc(g.items.length ? fmt(t, sum(g.items)) : '—') + '</b><span>' + esc(g.label.toLowerCase()) + ' (' + g.items.length + ')</span></div>';
    });
    h += '</div>';

    t.groups.forEach(function(g, gi){
      var st = sum(g.items);
      h += '<section class="grp"><div class="grphead"><h2>' + esc(g.label) + '</h2><span class="sub">' +
        (g.items.length ? g.items.length + ' ' + videos(g.items.length) + ' · ' + fmt(t, st) : 'zatím prázdné') + '</span></div>';
      h += '<div class="tablebox"><table><thead><tr><th class="num">#</th><th>Video</th><th class="price">Cena</th>' + (edit ? '<th class="act"></th>' : '') + '</tr></thead><tbody>';
      if (!g.items.length) h += '<tr><td class="empty" colspan="' + (edit ? 4 : 3) + '">Zatím žádná videa v této kategorii</td></tr>';
      g.items.forEach(function(it, i){
        h += '<tr><td class="num">' + (i + 1) + '</td>';
        if (edit) {
          h += '<td><input id="n-' + gi + '-' + i + '" data-g="' + gi + '" data-i="' + i + '" data-f="name" value="' + esc(it.name) + '" aria-label="Název videa"></td>' +
            '<td class="price"><input id="p-' + gi + '-' + i + '" class="p" data-g="' + gi + '" data-i="' + i + '" data-f="price" inputmode="decimal" value="' + esc(it.price) + '" aria-label="Cena"></td>' +
            '<td class="act"><button class="x" type="button" data-del="' + gi + '-' + i + '" title="Smazat" aria-label="Smazat ' + esc(it.name) + '">×</button></td>';
        } else {
          h += '<td>' + esc(it.name) + '</td><td class="price">' + esc(it.price === '' ? '—' : fmt(t, Number(it.price) || 0)) + '</td>';
        }
        h += '</tr>';
      });
      h += '</tbody><tfoot><tr><td class="num"></td><td>Mezisoučet — ' + esc(g.label) + '</td><td class="price">' +
        esc(g.items.length ? fmt(t, st) : '—') + '</td>' + (edit ? '<td class="act"></td>' : '') + '</tr></tfoot></table></div></section>';
    });

    h += '<div class="total"><span class="lbl">Celkem k úhradě</span><span class="sum">' + esc(n ? fmt(t, total) : '—') + '</span></div></article>';

    if (t.archives.length) {
      h += '<div class="arch-head"><h2>Archiv</h2><span>' + t.archives.length + ' ' + (t.archives.length === 1 ? 'měsíc' : (t.archives.length <= 4 ? 'měsíce' : 'měsíců')) + '</span></div>';
      h += '<div class="cards">';
      t.archives.forEach(function(ar){
        var aitems = ar.groups.reduce(function(acc, g){ return acc.concat(g.items); }, []);
        h += '<article class="card" data-arch="' + ar.id + '" tabindex="0" role="button" aria-label="Otevřít archiv ' + esc(ar.label) + '">' +
          '<div class="card-top"><h2>' + esc(ar.label) + '</h2><span class="card-client">uzavřený měsíc</span></div>' +
          '<div class="card-sum"><b>' + esc(fmt(t, sum(aitems))) + '</b><span>' + aitems.length + ' ' + videos(aitems.length) + '</span></div>' +
          '<div class="card-groups">' + ar.groups.map(function(g){ return '<span>' + esc(g.label) + ': ' + g.items.length + '</span>'; }).join('') + '</div>' +
          '<div class="card-acts"><button type="button" data-arch="' + ar.id + '" class="primary">Otevřít</button>' +
          (edit ? '<button type="button" class="x" data-del-arch="' + ar.id + '" title="Smazat archiv" aria-label="Smazat archiv ' + esc(ar.label) + '">×</button>' : '') +
          '</div></article>';
      });
      h += '</div>';
    }

    if (edit) {
      t.groups.forEach(function(g, gi){
        h += '<section class="panel"><h2>Přidat do <em>' + esc(g.label) + '</em></h2><div class="row">' +
          '<input id="new-name-' + gi + '" data-add="' + gi + '" placeholder="Název videa" aria-label="Název nového videa">' +
          '<input id="new-price-' + gi + '" class="p" data-addp="' + gi + '" inputmode="decimal" value="" aria-label="Cena nového videa">' +
          '<button type="button" class="primary" data-addbtn="' + gi + '">Přidat</button></div>' +
          '<textarea id="bulk-' + gi + '" aria-label="Víc videí najednou"></textarea>' +
          '<div class="row"><button type="button" data-bulk="' + gi + '">Přidat všechny</button></div></section>';
      });

    }

    if (edit) {
      h += '<section class="panel"><h2>Uzavřít měsíc</h2>' +
        '<p class="hint">Všechna videa z tabulky se přesunou do archivu <strong>' + esc(monthLabel()) + '</strong> a tabulka začne znovu od nuly. Archiv zůstane dole, takže se kdykoliv podíváte, co už je hotové.</p>' +
        '<div class="row"><button id="archive" type="button" class="primary"' + (n ? '' : ' disabled') + '>Archivovat ' + n + ' ' + videos(n) + '</button></div></section>';
    }

    return h;
  }

  function renderArchive(t, ar){
    var items = ar.groups.reduce(function(acc, g){ return acc.concat(g.items); }, []);
    var h = '';
    if (!exporting) {
      h += '<div class="bar"><button id="backtable" type="button">' + ICON.back + 'Zpět do tabulky</button>' +
        '<div class="btns"><button id="archtext" type="button">' + ICON.copy + 'Kopírovat text</button></div></div>';
    }
    h += '<article class="sheet"><header class="head"><div><div class="eyebrow">Uzavřený měsíc</div><h1>' + esc(ar.label) + '</h1></div>' +
      '<dl class="meta"><dt>Tabulka</dt><dd>' + esc(t.name) + '</dd>' +
      (t.client ? '<dt>Klient</dt><dd>' + esc(t.client) + '</dd>' : '') + '</dl></header>';

    h += '<div class="stats"><div class="stat"><b>' + items.length + '</b><span>' + videos(items.length) + ' celkem</span></div>';
    ar.groups.forEach(function(g){
      h += '<div class="stat"><b>' + esc(g.items.length ? fmt(t, sum(g.items)) : '—') + '</b><span>' + esc(g.label.toLowerCase()) + ' (' + g.items.length + ')</span></div>';
    });
    h += '</div>';

    ar.groups.forEach(function(g){
      h += '<section class="grp"><div class="grphead"><h2>' + esc(g.label) + '</h2><span class="sub">' +
        (g.items.length ? g.items.length + ' ' + videos(g.items.length) + ' · ' + fmt(t, sum(g.items)) : 'zatím prázdné') + '</span></div>' +
        '<div class="tablebox"><table><thead><tr><th class="num">#</th><th>Video</th><th class="price">Cena</th></tr></thead><tbody>';
      if (!g.items.length) h += '<tr><td class="empty" colspan="3">V téhle kategorii nebylo nic</td></tr>';
      g.items.forEach(function(it, i){
        h += '<tr><td class="num">' + (i + 1) + '</td><td>' + esc(it.name) + '</td><td class="price">' +
          esc(it.price === '' ? '—' : fmt(t, Number(it.price) || 0)) + '</td></tr>';
      });
      h += '</tbody><tfoot><tr><td class="num"></td><td>Mezisoučet — ' + esc(g.label) + '</td><td class="price">' +
        esc(g.items.length ? fmt(t, sum(g.items)) : '—') + '</td></tr></tfoot></table></div></section>';
    });

    h += '<div class="total"><span class="lbl">Celkem za ' + esc(ar.label) + '</span><span class="sum">' + esc(fmt(t, sum(items))) + '</span></div></article>';
    return h;
  }

  function findArchive(t, id){
    var found = null;
    if (t) t.archives.forEach(function(a){ if (a.id === id) found = a; });
    return found;
  }

  function render(){
    var t = openId ? findTable(openId) : null;
    var active = document.activeElement && document.activeElement.id;
    var pos = active && document.activeElement.selectionStart;
    var ar = openArchId ? findArchive(t, openArchId) : null;
    root.innerHTML = ar ? renderArchive(t, ar) : (t ? renderTable(t) : renderHome());
    if (active) {
      var el = document.getElementById(active);
      if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
    }
  }

  // ---------- akce ----------

  function openArchive(id){
    openArchId = id; render(); window.scrollTo(0, 0);
  }

  function openTable(id){
    openArchId = null;
    openId = id;
    try { sessionStorage.setItem('open-table', id); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }

  function goHome(){
    openId = null; openArchId = null;
    try { sessionStorage.removeItem('open-table'); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }

  function addOne(gi){
    var t = findTable(openId); if (!t) return;
    var ni = document.getElementById('new-name-' + gi), pi = document.getElementById('new-price-' + gi);
    var name = ni.value.trim(); if (!name) { ni.focus(); return; }
    t.groups[gi].items.push({ name: name, price: pi.value.trim() === '' ? '' : parsePrice(pi.value) });
    save(); render();
    var again = document.getElementById('new-name-' + gi);
    if (again) { again.value = ''; again.focus(); }
  }

  function archiveNow(t){
    var items = tableItems(t);
    if (!items.length) { toast('Tabulka je prázdná, není co archivovat'); return; }
    var label = monthLabel();
    var same = t.archives.filter(function(a){ return a.label.indexOf(label) === 0; }).length;
    if (same) label = label + ' (' + (same + 1) + ')';
    if (!window.confirm('Přesunout ' + items.length + ' ' + videos(items.length) + ' do archivu „' + label + '“? Tabulka se vyprázdní.')) return;
    t.archives.unshift({ id: uid(), label: label, groups: clone(t.groups) });
    t.groups.forEach(function(g){ g.items = []; });
    save(); render();
    toast('Hotovo — videa najdete dole v archivu ' + label);
  }

  function summary(t){
    var lines = [t.name];
    if (t.client) lines.push('Klient: ' + t.client);
    if (t.period) lines.push('Období: ' + t.period);
    lines.push('');
    t.groups.forEach(function(g){
      lines.push(g.label.toUpperCase() + ' — ' + g.items.length + ' ' + videos(g.items.length) + ', ' + fmt(t, sum(g.items)));
      g.items.forEach(function(it, i){ lines.push('  ' + (i + 1) + '. ' + it.name + (it.price === '' ? '' : ' — ' + fmt(t, Number(it.price) || 0))); });
      lines.push('');
    });
    var items = tableItems(t);
    lines.push('CELKEM: ' + items.length + ' ' + videos(items.length) + ' — ' + fmt(t, sum(items)));
    return lines.join('\n');
  }

  function copy(text, msg){
    msg = msg || 'Zkopírováno';
    if (native && post('copyText', text)) { toast(msg); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast(msg); }, function(){ showCopyDialog(text); });
    } else showCopyDialog(text);
  }

  function showCopyDialog(text){
    var dlg = document.getElementById('copydlg'), ta = document.getElementById('copytext');
    ta.value = text;
    if (dlg.showModal) { dlg.showModal(); ta.focus(); ta.select(); }
    else toast('Kopírování zde není povolené');
  }

  root.addEventListener('input', function(e){
    var el = e.target, t = findTable(openId);
    if (!t) return;
    if (el.dataset.f) {
      var it = t.groups[+el.dataset.g].items[+el.dataset.i];
      if (el.dataset.f === 'name') it.name = el.value; else it.price = el.value.trim() === '' ? '' : parsePrice(el.value);
      save(); render();
    } else if (el.dataset.meta) {
      t[el.dataset.meta] = el.value; save(); render();
    }
  });

  root.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    var gi = e.target.dataset.add || e.target.dataset.addp;
    if (gi != null) { e.preventDefault(); addOne(+gi); return; }
    var card = e.target.closest && e.target.closest('[data-open]');
    if (card && e.target === card) { e.preventDefault(); openTable(card.dataset.open); }
  });

  root.addEventListener('click', function(e){
    var b = e.target.closest('button');
    var t = findTable(openId);

    if (b) {
      if (b.dataset.open) { openTable(b.dataset.open); return; }
      if (b.dataset.arch) { openArchive(b.dataset.arch); return; }
      if (b.id === 'backtable') { openArchId = null; render(); window.scrollTo(0, 0); return; }
      if (b.id === 'archtext') {
        var art = findArchive(t, openArchId);
        if (art) copy(summary({ name: t.name + ' — ' + art.label, client: t.client, period: art.label,
                                currency: t.currency, groups: art.groups }), 'Přehled zkopírován');
        return;
      }
      if (b.dataset.link) {
        var lt = findTable(b.dataset.link);
        if (lt) copy(lt.shareUrl, 'Odkaz zkopírován — vložte ho do chatu');
        return;
      }
      if (b.dataset.delTable) {
        var dt = findTable(b.dataset.delTable);
        if (dt && window.confirm('Opravdu smazat tabulku „' + dt.name + '“? Tahle akce se nedá vrátit.')) {
          state.tables = state.tables.filter(function(x){ return x.id !== dt.id; });
          save(); render();
        }
        return;
      }
      if (b.id === 'new') {
        var nt = normalizeTable({ name: 'Nová tabulka', groups: emptyGroups() }, state.tables.length);
        state.tables.push(nt); save(); openTable(nt.id);
        setTimeout(function(){ var f = document.getElementById('f-name'); if (f) { f.focus(); f.select(); } }, 30);
        return;
      }
      if (b.id === 'home') { goHome(); return; }
      if (!t) return;
      if (b.id === 'archive') { archiveNow(t); return; }
      if (b.dataset.delArch) {
        var ar = null;
        t.archives.forEach(function(x){ if (x.id === b.dataset.delArch) ar = x; });
        if (ar && window.confirm('Opravdu smazat archiv „' + ar.label + '“? Tahle akce se nedá vrátit.')) {
          t.archives = t.archives.filter(function(x){ return x.id !== ar.id; });
          save(); render();
        }
        return;
      }
      if (b.id === 'link') { copy(t.shareUrl, 'Odkaz zkopírován — vložte ho do chatu'); return; }
      if (b.id === 'sharetext') { copy(summary(t), 'Přehled zkopírován'); return; }
      if (b.id === 'png') { if (post('savePNG', '')) toast('Ukládám obrázek na plochu…'); return; }
      if (b.id === 'pdf') { if (post('savePDF', '')) toast('Ukládám PDF na plochu…'); else window.print(); return; }
      if (b.dataset.del != null) {
        var p = b.dataset.del.split('-');
        t.groups[+p[0]].items.splice(+p[1], 1); save(); render(); return;
      }
      if (b.dataset.addbtn != null) { addOne(+b.dataset.addbtn); return; }
      if (b.dataset.bulk != null) {
        var gi = +b.dataset.bulk, ta = document.getElementById('bulk-' + gi);
        ta.value.split(/\n/).forEach(function(l){
          l = l.trim(); if (!l) return;
          var m = l.match(/^(.*?)\s*[–—-]?\s*(\d[\d\s]*(?:[.,]\d+)?)\s*(?:kč|czk)?\s*$/i);
          if (m && m[1].trim()) t.groups[gi].items.push({ name: m[1].replace(/[:\s–—-]+$/, '').trim(), price: parsePrice(m[2]) });
          else t.groups[gi].items.push({ name: l.replace(/[:\s]+$/, ''), price: '' });
        });
        save(); render(); return;
      }
      return;
    }

    var card = e.target.closest('.card');
    if (card && card.dataset.open) openTable(card.dataset.open);
    else if (card && card.dataset.arch) openArchive(card.dataset.arch);
  });

  window.__setExport = function(){};
  var __unused = function(on){
    if (on) { exporting = true; document.documentElement.setAttribute('data-theme', 'light'); }
    else { exporting = false; document.documentElement.removeAttribute('data-theme'); }
    render();
  };

  render();
})();
</script>

</body>
</html>
