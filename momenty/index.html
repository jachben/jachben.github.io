<!doctype html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060b">
<title>Momenty · Maturitní ples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;700;800&family=Orbitron:wght@600;800&family=Syne:wght@600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1d1d1b; --glass: #262624; --glass-2: #2e2e2b; --line: rgba(255,255,255,.14);
    --text: #f4f4ef; --muted: #a9a9a2; --ok: #7dffb0; --warn: #ffd166; --bad: #ff6b6b;
    --a1: #2452e8; --a2: #5c82ff; --a3: #ffffff; --on-a: #ffffff;
    --display: 'Silkscreen', 'Space Grotesk', sans-serif;
    --r: 4px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  [data-theme="aurora"] { --a1: #7dff6a; --a2: #22e5ff; --a3: #4d7cff; }
  [data-theme="synth"]  { --a1: #ff3df2; --a2: #ff8a3d; --a3: #8b5cff; }
  [data-theme="gold"]   { --a1: #ffd27a; --a2: #ff7a9c; --a3: #b98bff; }
  [data-theme="ice"]    { --a1: #e9f6ff; --a2: #6ac8ff; --a3: #8b9dff; }
  [data-font="orbitron"] { --display: 'Orbitron', sans-serif; }
  [data-font="syne"]     { --display: 'Syne', sans-serif; }
  [data-font="fraunces"] { --display: 'Fraunces', Georgia, serif; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 'Space Grotesk', system-ui, -apple-system, sans-serif; min-height: 100vh; overflow-x: hidden; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  a { color: var(--a1); }
  img { display: block; }
  [hidden] { display: none !important; }

  /* animated background */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
  .bg::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.16) 1.1px, transparent 1.6px); background-size: 9px 9px; mask-image: linear-gradient(180deg, #000 0%, transparent 55%); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 55%); }
  .bg i { display: none; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px calc(120px + var(--safe-b)); }
  .disp { font-family: var(--display); font-weight: 800; letter-spacing: -.01em; }
  h2 { font-family: var(--display); font-size: 19px; font-weight: 700; margin: 0 0 12px; letter-spacing: .01em; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .grad { color: var(--a2); }
  .link { color: var(--a1); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  /* glass card with gradient border */
  .card { position: relative; background: var(--glass); border-radius: var(--r); padding: 18px; margin-top: 16px; border: 1px solid var(--line); }
  .card.glow { border: 2px solid var(--a1); background: var(--bg); }
  .card.glow::before { content: none; }

  /* hero */
  .hero { position: relative; text-align: center; padding: calc(36px + var(--safe-t)) 8px 10px; overflow: hidden; }
  .hero.cover { margin: 0 -16px; padding: calc(80px + var(--safe-t)) 24px 26px; background-size: cover; background-position: center; border-radius: 0 0 32px 32px; overflow: hidden; }
  .hero.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,6,11,.25), rgba(5,6,11,.94)); }
  .hero > * { position: relative; }
  .avatar-ring { width: 124px; height: 124px; margin: 0 auto 16px; padding: 0; border-radius: 0; background: var(--a1); }
  .avatar-ring img { width: 100%; height: 100%; border-radius: 0; object-fit: cover; border: 0; background: #111; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 0; font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    background: transparent; border: 1px solid var(--text); color: var(--text); }
  .chip .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(38px, 12vw, 72px); line-height: .95; margin: 18px 0 8px; text-transform: uppercase; color: var(--text); text-wrap: balance; }
  .hero h1 .grad { color: var(--a2); }
  .hero .sub { font-weight: 600; letter-spacing: .06em; margin: 0 0 12px; }
  .hero .welcome { max-width: 480px; margin: 0 auto; color: var(--muted); white-space: pre-line; }
  .countdown { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
  .countdown div { min-width: 64px; padding: 10px 6px; border-radius: 0; background: var(--a1); border: 0; color: #fff; }
  .countdown b { display: block; font-family: var(--display); font-size: 22px; line-height: 1; }
  .countdown span { font-size: 11px; color: #fff; text-transform: uppercase; letter-spacing: .08em; }

  /* poster-style extras */
  .poster-art { margin: 26px auto 0; max-width: 420px; border: 2px solid var(--text); box-shadow: 10px 10px 0 var(--a1); background: var(--bg); position: relative; }
  .poster-art img { width: 100%; height: auto; display: block; }
  .poster-art::after { content: ""; position: absolute; left: -2px; right: -2px; top: -2px; height: 8px; background: repeating-linear-gradient(90deg, var(--a1) 0 8px, transparent 8px 16px); }
  .hero-date { font-family: var(--display); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--text); margin: 14px 0 0; }
  .hero-date b { color: var(--a1); font-weight: 400; }
  .hero-frame { position: relative; margin: 0 -16px; padding: 22px 16px 0; }
  .hero-frame::before { content: ""; position: absolute; inset: 10px 10px auto; height: 100%; border: 2px solid var(--a1); pointer-events: none; }
  .brush { position: absolute; right: -6%; top: 6%; width: 62%; max-width: 360px; height: auto; pointer-events: none; z-index: 0; opacity: .95; }
  .hero .brush { z-index: 0; }
  .ticker { overflow: hidden; background: var(--a1); color: #fff; font-family: var(--display); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; padding: 9px 0; margin: 0 -16px; }
  .ticker .track { display: inline-flex; animation: tick 22s linear infinite; }
  .ticker span { padding-right: 36px; }
  @keyframes tick { to { transform: translateX(-50%); } }
  .halftone { position: relative; height: 150px; margin: 26px -16px 0; overflow: hidden; background: var(--text); }
  .halftone::before { content: ""; position: absolute; inset: 0; background: radial-gradient(var(--bg) 38%, transparent 42%) 0 0 / 11px 11px; }
  .halftone::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--bg) 0%, transparent 35%, transparent 75%, var(--bg) 100%); }
  .halftone i { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: var(--a1); clip-path: polygon(0 100%, 0 40%, 30% 10%, 55% 0, 78% 14%, 100% 36%, 100% 100%); z-index: 1; }
  .pixel-rule { height: 10px; margin: 22px 0 0; background: repeating-linear-gradient(90deg, var(--text) 0 10px, transparent 10px 20px); opacity: .9; }

  /* buttons */
  .actions { display: grid; gap: 10px; margin: 24px 0 8px; }
  .btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 18px;
    border-radius: 18px; font-weight: 600; text-decoration: none; transition: transform .12s, box-shadow .2s, background .2s; overflow: hidden; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn-main { min-height: 74px; font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--a1); border-radius: 0; }
  .btn-main svg { width: 28px; height: 28px; }
  .btn-glass { background: transparent; border: 2px solid var(--text); color: var(--text); border-radius: 0; }
  .btn-glass:hover { background: var(--text); color: var(--bg); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; min-height: 52px; }
  .field svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
  .field input { flex: 1; border: 0; background: none; outline: none; min-width: 0; padding: 12px 0; font-size: 16px; }
  .note { font-size: 13px; color: var(--muted); text-align: center; margin: 12px 6px 0; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .stat { text-align: center; padding: 14px 6px; border-radius: 0; background: var(--glass); border: 1px solid var(--line); }
  .stat b { display: block; font-family: var(--display); font-size: 24px; line-height: 1.1; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

  .nav-card { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; width: 100%; text-align: left; }
  .nav-card .ico { width: 48px; height: 48px; border-radius: 0; display: grid; place-items: center; flex: none; font-size: 22px; background: var(--a1); color: #fff; }
  .nav-card .ico svg { width: 24px; height: 24px; }
  .nav-card b { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .03em; text-transform: uppercase; }
  .nav-card .chev { margin-left: auto; color: var(--muted); font-size: 22px; }

  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 12px; }
  .sec-head h2 { margin: 0; }
  .sec-head button { color: var(--a1); font-weight: 600; }

  .program { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 560px) { .program { grid-template-columns: repeat(4, 1fr); } }
  .program li { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; border-radius: 0; background: var(--glass); border: 1px solid var(--line); transition: background .2s, transform .15s; min-width: 0; }
  .program li:hover { background: #33332f; transform: translateY(-2px); }
  .program time { font-family: var(--display); font-size: 18px; color: #22e5ff; font-variant-numeric: tabular-nums; }
  .program li span { font-size: 14px; font-weight: 600; line-height: 1.25; color: var(--text); overflow-wrap: anywhere; }
  .program li.done { opacity: .45; }
  .program li.now { background: linear-gradient(160deg, #22e5ff, #8b5cff 60%, #ff3df2); border-color: transparent; }
  .program li.now time, .program li.now span { color: #04060d; }
  .program li.now::after { content: "TEĎ"; position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; letter-spacing: .12em; padding: 2px 6px; background: #04060d; color: #fff; border-radius: 0; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 18px; overflow: hidden; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .tile { position: relative; aspect-ratio: 1; background: #2a2a27; overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s, transform .35s; }
  .tile img.ld { opacity: 1; }
  .tile:hover img { transform: scale(1.04); }
  .tile .mine { position: absolute; top: 7px; left: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--a1); box-shadow: 0 0 10px var(--a1); }
  .tile .meta { position: absolute; bottom: 5px; right: 7px; display: flex; gap: 6px; font-size: 12px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .empty { text-align: center; padding: 34px 20px; color: var(--muted); }
  .empty .big { font-size: 40px; margin-bottom: 6px; }

  /* topbar */
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; margin: 0 -16px 14px; padding: calc(12px + var(--safe-t)) 16px 12px;
    background: rgba(5,6,11,.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); }
  .topbar h2 { margin: 0; font-size: 18px; }
  .icon-btn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--line); flex: none; }
  .icon-btn svg { width: 20px; height: 20px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 9px 15px; border-radius: 0; background: transparent; border: 1px solid var(--text); white-space: nowrap; font-size: 14px; font-weight: 600; }
  .tab.on { background: var(--a1); color: #fff; border-color: transparent; border-radius: 0; }

  /* upload bar */
  .ubar { position: fixed; left: 50%; bottom: calc(16px + var(--safe-b)); transform: translate(-50%, 160%); z-index: 30; width: min(460px, calc(100% - 32px));
    background: var(--bg); border: 2px solid var(--a1); border-radius: 0; padding: 13px 15px;
    transition: transform .4s cubic-bezier(.2,.9,.3,1.25); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .ubar.show { transform: translate(-50%, 0); }
  .ubar .row { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .ubar .row button { margin-left: auto; color: var(--a1); font-weight: 700; font-size: 14px; }
  .ubar .prog { height: 5px; border-radius: 5px; background: rgba(255,255,255,.08); margin-top: 10px; overflow: hidden; }
  .ubar .prog i { display: block; height: 100%; width: 0; background: var(--a1); transition: width .4s; }
  .dot { width: 10px; height: 10px; border-radius: 0; background: var(--a1); flex: none; animation: blink 1.1s infinite; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: none; } .dot.warn { background: var(--warn); box-shadow: 0 0 10px var(--warn); }

  .toast { position: fixed; left: 50%; top: calc(14px + var(--safe-t)); transform: translate(-50%, -180%); z-index: 80; display: flex; gap: 12px; align-items: center;
    width: min(460px, calc(100% - 32px)); padding: 12px 14px; border-radius: 0; background: var(--bg); border: 2px solid var(--text); transition: transform .4s cubic-bezier(.2,.9,.3,1.25); font-size: 15px; }
  .toast.show { transform: translate(-50%, 0); }
  .toast button { margin-left: auto; padding: 9px 13px; border-radius: 0; background: var(--a1); color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; }

  /* lightbox */
  .lb { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column; touch-action: pan-y; }
  .lb-top, .lb-bot { position: absolute; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
  .lb-top { top: 0; background: linear-gradient(rgba(0,0,0,.75), transparent); padding-top: calc(12px + var(--safe-t)); }
  .lb-bot { bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.85)); padding-bottom: calc(16px + var(--safe-b)); flex-wrap: wrap; justify-content: center; }
  .lb-top .who { font-weight: 700; } .lb-top .when { font-size: 13px; color: var(--muted); }
  .lb-top .icon-btn { margin-left: auto; background: rgba(255,255,255,.12); border: 0; }
  .lb-stage { flex: 1; display: grid; place-items: center; overflow: hidden; }
  .lb-stage img { max-width: 100%; max-height: 100vh; object-fit: contain; transition: transform .25s, opacity .25s; user-select: none; -webkit-user-drag: none; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 48px; height: 48px; border-radius: 0; background: var(--a1); display: none; place-items: center; }
  @media (hover: hover) { .lb-nav { display: grid; } }
  .lb-nav.prev { left: 14px; } .lb-nav.next { right: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 0; background: rgba(255,255,255,.14); font-weight: 600; font-size: 14px; color: #fff; text-decoration: none; border: 0; }
  .pill.on { background: var(--a1); }
  .pill.danger { background: rgba(255,92,122,.22); }
  .pill.acc { background: var(--a1); color: #fff; border-radius: 0; }

  /* sheet (comments) */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; max-height: 72vh; display: flex; flex-direction: column; background: var(--bg);
    border-top: 3px solid var(--a1); border-radius: 0; padding: 10px 16px calc(14px + var(--safe-b)); transform: translateY(105%); visibility: hidden; transition: transform .35s cubic-bezier(.2,.9,.3,1), visibility 0s .35s; backdrop-filter: blur(20px); }
  .sheet.show { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.2,.9,.3,1); }
  .sheet .grip { width: 44px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.2); margin: 0 auto 12px; }
  .sheet .list { overflow-y: auto; flex: 1; min-height: 80px; }
  .cm { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cm b { font-size: 14px; } .cm p { margin: 2px 0 0; word-wrap: break-word; }
  .cm .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
  .cm .meta button { color: var(--bad); margin-left: auto; }
  .cm-form { display: flex; gap: 8px; margin-top: 10px; }
  .cm-form input { flex: 1; min-width: 0; }

  /* forms */
  .inp { width: 100%; background: #262624; border: 1px solid var(--line); border-radius: 0; padding: 12px 14px; outline: none; font-size: 16px; transition: border-color .2s, box-shadow .2s; }
  .inp:focus { border-color: var(--a1); box-shadow: none; }
  textarea.inp { min-height: 100px; resize: vertical; }
  select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  select.inp option { background: #12141f; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .1em; }
  .chk { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 15px; }
  .chk input { width: 22px; height: 22px; accent-color: var(--a1); flex: none; }

  .msg { margin-top: 10px; }
  .msg .to { font-weight: 700; font-size: 14px; } .msg .to span { color: var(--a1); }
  .msg p { margin: 6px 0; white-space: pre-wrap; word-wrap: break-word; }
  .msg .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
  .msg .meta button { margin-left: auto; color: var(--bad); }

  /* modal */
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.8); display: grid; place-items: center; padding: 16px; }
  .modal .box { width: min(380px, 100%); text-align: center; margin: 0; }
  .qr-box { background: #fff; border-radius: 0; padding: 14px; display: inline-block; margin: 14px 0; }
  .qr-box img, .qr-box canvas { width: 220px !important; height: 220px !important; }

  /* admin */
  .adm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .adm-grid a, .adm-grid button { display: flex; align-items: center; gap: 8px; padding: 13px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600; text-align: left; }
  .remote { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .remote button { padding: 16px 6px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
  .remote button.on { background: var(--a1); color: #fff; }
  .pend { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .pend img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; background: #111; flex: none; cursor: zoom-in; }
  .pend .sp { flex: 1; font-size: 14px; min-width: 0; }
  .pend .bt { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .warnbox { padding: 12px 14px; border-radius: 14px; background: rgba(255,198,92,.1); border: 1px solid rgba(255,198,92,.35); font-size: 13px; margin-top: 10px; word-break: break-word; }
  .imgrow { display: flex; align-items: center; gap: 14px; }
  .imgrow .ph { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.06); border: 2px solid var(--line); flex: none; }
  .imgrow .ph.cover { width: 128px; border-radius: 14px; }
  .sbtn { padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .prow { display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .prow .x { display: flex; gap: 4px; }
  .prow .x button { width: 36px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 52px; height: 52px; border-radius: 16px; border: 2px solid transparent; position: relative; }
  .sw.on { border-color: #fff; box-shadow: 0 0 20px -2px rgba(255,255,255,.5); }

            if (size > 4) { var off = t + g32(ge + 8); for (var k = 0; k < size && off + k < end; k++) v.setUint8(off + k, 0); }
          }
          for (var z = 0; z < 2 + gn * 12 && gps + z < end; z++) v.setUint8(gps + z, 0);
        }
      } else if (m === 0xFFE1) {
        var head = ''; for (var h = 0; h < 28; h++) head += String.fromCharCode(v.getUint8(o + 4 + h));
        if (head.indexOf('http://ns.adobe.com/xap') === 0) for (var x = o + 4 + 29; x < end; x++) v.setUint8(x, 0x20);
      }
      o = end;
    }
  } catch (err) { /* poškozená metadata: nahraje se beze změny */ }
  return buf;
}

function readBuf(blob) {
  if (blob.arrayBuffer) return blob.arrayBuffer();
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsArrayBuffer(blob); });
}

function prep(file) {
  var max = +(S.cfg && S.cfg.maxSize) || 0;
  var type = file.type || 'image/jpeg';
  if (!max || !/^image\/(jpeg|png|webp|heic|heif)$/.test(type)) {
    if (type !== 'image/jpeg') return Promise.resolve(file);
    return readBuf(file).then(function (b) { return new Blob([stripGps(b)], { type: 'image/jpeg' }); }).catch(function () { return file; });
  }
  var url = URL.createObjectURL(file);
  return loadImage(url).then(function (img) {
    var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return new Promise(function (res) { c.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.9); });
  }).catch(function () { return file; }).then(function (b) { URL.revokeObjectURL(url); return b; });
}

function toB64(blob) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1]); };
    r.onerror = function () { rej(r.error); };
    r.readAsDataURL(blob);
  });
}

function addFiles(files, fromCamera) {
  files = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type) || !f.type; });
  if (!files.length) return;
  S.total += files.length; updateBar();
  var chain = Promise.resolve();
  files.forEach(function (file) {
    chain = chain.then(function () { return prep(file); }).then(function (blob) {
      var it = { cid: uid(), blob: blob, mime: blob.type || 'image/jpeg', author: S.name, tries: 0 };
      it.url = URL.createObjectURL(blob);
      S.queue.push(it); IDB.put({ cid: it.cid, blob: it.blob, mime: it.mime, author: it.author, tries: 0 });
      pump();
    });
  });
  chain.then(function () {
    if (fromCamera && files.length === 1) toast('Fotka letí do galerie ✦', 'Uložit do mobilu', function () { saveFile(files[0], 'foto-' + Date.now() + '.jpg'); }, 8000);
  });
}

var pumping = false;
function pump() {
  if (pumping) return;
  pumping = true;
  (function next() {
    if (!S.queue.length) { pumping = false; updateBar(); return; }
    if (navigator.onLine === false) { pumping = false; updateBar('offline'); return; }
    var it = S.queue[0];
    updateBar();
    toB64(it.blob).then(function (data) {
      return api('uploadPhoto', { data: data, mime: it.mime, cid: it.cid, author: it.author });
    }).then(function (r) {
      S.queue.shift(); IDB.del(it.cid); S.done++;
      if (!mySet[r.id]) { mySet[r.id] = 1; S.my.unshift(r.id); save('my', S.my.slice(0, 3000)); }
      S.local[r.id] = it.url;
      if (r.pending) toast('Fotka čeká na schválení pořadatelem');
      else if (!S.photos.some(function (p) { return p.id === r.id; })) {
        S.photos.unshift({ id: r.id, a: it.author, t: Date.now(), hr: 0, lr: 0, c: 0, _local: 1 });
        refresh();
      }
      next();
    }).catch(function (err) {
      it.tries++;
      if (it.tries >= 8 || /uzavřená|Neplatná/.test(errMsg(err))) {
        S.queue.shift(); IDB.del(it.cid); S.failed++;
        toast('Fotku se nepodařilo odeslat: ' + errMsg(err));
        return next();
      }
      updateBar('retry');
      setTimeout(next, Math.min(30000, 1500 * Math.pow(2, it.tries)));
    });
  })();
}
window.addEventListener('online', pump);
window.addEventListener('offline', function () { if (S.queue.length) updateBar('offline'); });

var barTimer = 0;
function updateBar(mode) {
  var bar = $('#ubar'), dot = $('#udot'), txt = $('#utext'), act = $('#uaction'), prog = $('#uprog');
  clearTimeout(barTimer);
  if (!S.total) { bar.classList.remove('show'); return; }
  var left = S.total - S.done - S.failed;
  act.hidden = true;
  prog.style.width = Math.round(100 * (S.done + S.failed) / S.total) + '%';
  if (left > 0) {
    dot.className = 'dot' + (mode ? ' warn' : '');
    txt.textContent = mode === 'offline' ? 'Bez signálu · odešlu, až se připojíš (' + left + ')'
      : mode === 'retry' ? 'Slabý signál · zkouším znovu · ' + (S.done + 1) + ' z ' + S.total
      : 'Odesílám fotky · ' + Math.min(S.done + 1, S.total) + ' z ' + S.total;
    bar.classList.add('show');
  } else {
    dot.className = 'dot ok';
    txt.textContent = 'Hotovo · ' + S.done + ' ' + plural(S.done, 'fotka odeslána', 'fotky odeslány', 'fotek odesláno');
    act.hidden = false; act.textContent = 'Zobrazit';
    act.onclick = function () { S.tab = 'mine'; go('gallery'); };
    bar.classList.add('show');
    barTimer = setTimeout(function () { bar.classList.remove('show'); S.total = S.done = S.failed = 0; }, 5000);
  }
}

/* ======================================================= save to phone */
function saveFile(file, name) {
  try {
    var f = file instanceof File ? file : new File([file], name, { type: file.type || 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      return navigator.share({ files: [f] }).catch(function (e) { if (e && e.name !== 'AbortError') download(f, name); });
    }
    download(f, name);
  } catch (e) { download(file, name); }
}
function download(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.target = '_self';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}

function toast(text, btn, fn, ms) {

  toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 3500);
}

function adminAct(action, id) {
  if (action === 'delete' && !confirm('Opravdu smazat? Fotka půjde do koše na Disku.')) return;
  adm(action, id).then(function () {
    var moved = S.photos.concat(S.pending, S.hidden).filter(function (p) { return p.id === id; })[0];
    S.photos = S.photos.filter(function (p) { return p.id !== id; });
    S.pending = S.pending.filter(function (p) { return p.id !== id; });
    S.hidden = S.hidden.filter(function (p) { return p.id !== id; });
    if (moved && action === 'hide') S.hidden.unshift(moved);
    if (moved && (action === 'approve' || action === 'restore')) { moved.r = 0; S.photos.unshift(moved); S.photos.sort(function (a, b) { return b.t - a.t; }); }
    if (!lb.hidden) { S.lbList = S.lbList.filter(function (p) { return p.id !== id; }); if (S.lbIndex >= S.lbList.length) S.lbIndex--; S.lbList.length ? showLb() : closeLb(); }
    render(true);
    toast({ approve: 'Zveřejněno ✓', restore: 'Obnoveno ✓', hide: 'Skryto', delete: 'Smazáno' }[action]);
  }).catch(function (e) { toast('Chyba: ' + errMsg(e)); });
}

function cropImage(file, size, square) {
  var url = URL.createObjectURL(file);
  return loadImage(url).then(function (img) {
    var w = img.naturalWidth, h = img.naturalHeight, c = document.createElement('canvas'), x = c.getContext('2d');
    if (square) { var m = Math.min(w, h); c.width = c.height = Math.min(size, m); x.drawImage(img, (w - m) / 2, (h - m) / 2, m, m, 0, 0, c.width, c.height); }
    else { var s = Math.min(1, size / Math.max(w, h)); c.width = Math.round(w * s); c.height = Math.round(h * s); x.drawImage(img, 0, 0, c.width, c.height); }
    URL.revokeObjectURL(url);
    return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.9); });
  });
}

function bindSettings() {
  var form = $('#setForm'), rows = $('#progRows'), imgIn = $('#setImgIn'), which = '';
  $('#addRow').onclick = function () { rows.insertAdjacentHTML('beforeend', progRow(['', ''])); rows.lastElementChild.querySelector('input').focus(); };
  rows.onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var row = b.closest('.prow');
    if (b.hasAttribute('data-rm')) row.remove();
    else if (b.hasAttribute('data-up') && row.previousElementSibling) rows.insertBefore(row, row.previousElementSibling);
  };
  form.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-img],button[data-imgdel],button[data-theme],button[data-font]'); if (!b || !form.contains(b)) return;
    if (b.hasAttribute('data-theme')) { draft.theme = b.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme', draft.theme); reSettings(); return; }
    if (b.hasAttribute('data-font')) { draft.font = b.getAttribute('data-font'); document.documentElement.setAttribute('data-font', draft.font); reSettings(); return; }
    if (b.hasAttribute('data-img')) { which = b.getAttribute('data-img'); imgIn.click(); return; }
    var k = b.getAttribute('data-imgdel');
    if (!confirm('Odebrat fotku?')) return;
    adm(k === 'avatarId' ? 'setAvatar' : 'setCover', null).then(function () { S.cfg[k] = ''; draft[k] = ''; reSettings(); });
  });
  imgIn.onchange = function () {
    var f = imgIn.files[0]; imgIn.value = ''; if (!f) return;
    toast('Nahrávám fotku…', null, null, 30000);
    cropImage(f, which === 'avatarId' ? 800 : 2000, which === 'avatarId').then(toB64).then(function (data) {
      return adm(which === 'avatarId' ? 'setAvatar' : 'setCover', { data: data, mime: 'image/jpeg' });
    }).then(function (id) { S.cfg[which] = id; draft[which] = id; reSettings(); toast('Fotka uložena ✓'); })
      .catch(function (e) { toast('Nepodařilo se: ' + errMsg(e)); });
  };
  form.onsubmit = function (e) {
    e.preventDefault();
    var data = collectSettings(), btn = $('#saveBtn');
    btn.disabled = true; btn.textContent = 'Ukládám…';
    adm('saveSettings', data).then(function (st) {
      var driveUrl = S.cfg.driveUrl || S.driveUrl;
      Object.keys(st).forEach(function (k) { S.cfg[k] = st[k]; });
      S.cfg.driveUrl = st.showDriveLink ? driveUrl : '';
      applyTheme();
      toast('Uloženo ✓ Hosté uvidí změny po obnovení stránky');
      go('home');
    }).catch(function (err) { btn.disabled = false; btn.textContent = 'Uložit změny'; toast('Nepodařilo se: ' + errMsg(err)); });
  };
}

var moreObs = null;
function bindView() {
  var nameIn = $('#nameIn');
  if (nameIn) nameIn.oninput = function () { S.name = nameIn.value.trim(); save('name', S.name); };
  if (moreObs) moreObs.disconnect();
  var more = $('#more');
  if (more && 'IntersectionObserver' in window) {
    moreObs = new IntersectionObserver(function (e) { if (e[0].isIntersecting) { S.shown += 60; render(true); } }, { rootMargin: '700px' });
    moreObs.observe(more);
  }
  var form = $('#msgForm');
  if (form) form.onsubmit = function (e) {
    e.preventDefault();
    var fd = new FormData(form), btn = form.querySelector('button');
    var m = { from: fd.get('from'), to: fd.get('to'), text: fd.get('text') };
    if (!String(m.text).trim()) return;
    btn.disabled = true; btn.textContent = 'Posílám…';
    if (m.from) { S.name = String(m.from).trim(); save('name', S.name); }

      S.messages = list; S.msgCount = list.length; updateMsgList();
      form.querySelector('[name=text]').value = ''; form.querySelector('[name=to]').value = '';
      btn.disabled = false; btn.textContent = 'Poslat vzkaz'; toast('Vzkaz odeslán ✓');
    }).catch(function (err) { btn.disabled = false; btn.textContent = 'Poslat vzkaz'; toast('Nepodařilo se: ' + errMsg(err)); });
  };
  if (S.view === 'messages' && S.messages === null) {
    api('listMessages').then(function (l) { S.messages = l; S.msgCount = l.length; updateMsgList(); }).catch(function () { S.messages = []; updateMsgList(); });
  }
  var co = $('#coForm');
  if (co) co.onsubmit = function (e) {
    e.preventDefault(); var fd = new FormData(co);
    adm('addCoAdmin', fd.get('name'), fd.get('pw')).then(function (l) { S.coAdmins = l; render(true); toast('Spolupořadatel přidán. Pošli mu odkaz a heslo.'); })
      .catch(function (err) { toast(errMsg(err)); });
  };
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-go],[data-act],[data-tab],.tile,[data-adm],[data-delmsg],[data-scr],[data-admtab],[data-rmco],[data-zoom]');
  if (!t) return;
  if (t.hasAttribute('data-go')) { go(t.getAttribute('data-go')); return; }
  if (t.closest('#setForm')) return;
  if (t.hasAttribute('data-tab')) { S.tab = t.getAttribute('data-tab'); S.shown = 60; render(true); return; }
  if (t.hasAttribute('data-admtab')) { S.admTab = t.getAttribute('data-admtab'); render(true); return; }
  if (t.classList.contains('tile')) { S.lbList = S.view === 'gallery' ? currentList() : S.photos; openLb(+t.getAttribute('data-i')); return; }
  if (t.hasAttribute('data-zoom')) { var src = S.admTab === 'pending' ? S.pending : S.hidden, zid = t.getAttribute('data-zoom'); S.lbList = src; openLb(src.map(function (p) { return p.id; }).indexOf(zid)); return; }
  if (t.hasAttribute('data-adm')) { adminAct(t.getAttribute('data-adm'), t.getAttribute('data-id')); return; }
  if (t.hasAttribute('data-rmco')) { if (confirm('Odebrat spolupořadatele?')) adm('removeCoAdmin', t.getAttribute('data-rmco')).then(function (l) { S.coAdmins = l; render(true); }); return; }
  if (t.hasAttribute('data-delmsg')) {
    if (!confirm('Smazat vzkaz?')) return;
    adm('delMsg', t.getAttribute('data-delmsg')).then(function (l) { S.messages = l; S.msgCount = l.length; updateMsgList(); });
    return;
  }
  if (t.hasAttribute('data-scr')) {
    var k = t.getAttribute('data-scr'), sc = S.screen || {};
    if (k === 'pause') screenCmd({ paused: !sc.paused });
    else if (k === 'next') screenCmd({ next: true });
    else if (k === 'qr') screenCmd({ qr: !sc.qr });
    else if (k === 'speed') screenCmd({ speed: +t.getAttribute('data-v') });
    else if (k === 'latest') { if (S.photos[0]) screenCmd({ show: S.photos[0].id }); else toast('Zatím žádná fotka'); }
    return;
  }
  var a = t.getAttribute('data-act');
  if (a === 'cam') $('#camIn').click();
  else if (a === 'pick') $('#pickIn').click();
  else if (a === 'share') showQrModal();
  else if (a === 'login') showLogin();
  else if (a === 'logout') { S.role = ''; S.admin = ''; save('admin', ''); go('home'); toast('Odhlášeno'); }
  else if (a === 'wipe') {
    if (!confirm('Opravdu smazat VŠECHNY fotky, vzkazy a komentáře?')) return;
    if (prompt('Pro potvrzení napiš SMAZAT') !== 'SMAZAT') return;
    adm('wipe').then(function () { S.photos = []; S.pending = []; S.hidden = []; S.msgCount = 0; S.messages = null; render(true); toast('Vše smazáno'); })
      .catch(function (err) { toast(errMsg(err)); });
  }
});

function qr(el, size) {
  if (!el) return;
  el.innerHTML = '';
  if (window.QRCode) new QRCode(el, { text: APP_URL, width: size, height: size, colorDark: '#05060b', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  else el.innerHTML = '<img alt="QR kód" width="' + size + '" height="' + size + '" src="https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(APP_URL) + '">';
}

function showQrModal() {
  modal('<h2>Naskenuj a foť</h2><p class="muted small" style="margin:0">Ukaž kód ostatním. Otevře se jim galerie, nic neinstalují ani se nepřihlašují.</p>' +
    '<div class="qr-box" id="qrHere"></div>' +
    '<button class="btn btn-main" style="width:100%;min-height:52px;font-size:16px" id="shareLink">Sdílet odkaz</button>');
  qr($('#qrHere'), 240);
  $('#shareLink').onclick = function () {
    if (navigator.share) navigator.share({ title: S.cfg.title, url: APP_URL }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(APP_URL).then(function () { toast('Odkaz zkopírován'); });
  };
}

/* ============================================================ lightbox */
var lb = $('#lb'), lbImg = $('#lbImg'), sheet = $('#sheet');
function openLb(i) { if (i < 0 || !S.lbList[i]) return; S.lbIndex = i; lb.hidden = false; document.body.style.overflow = 'hidden'; showLb(); }
function closeLb() { lb.hidden = true; closeSheet(); document.body.style.overflow = ''; }
function curPhoto() { return S.lbList[S.lbIndex]; }
function showLb() {
  var p = curPhoto(); if (!p) return closeLb();
  lbImg.style.opacity = '.3';
  lbImg.onload = function () { lbImg.style.opacity = '1'; };
  lbImg.onerror = function () {
    if (lbImg.src.indexOf('lh3') > -1) lbImg.src = IMG.bigAlt(p.id);
    else if (S.local[p.id] && lbImg.src !== S.local[p.id]) lbImg.src = S.local[p.id];
    lbImg.style.opacity = '1';
  };
  lbImg.src = p._local && S.local[p.id] ? S.local[p.id] : IMG.big(p.id);
  $('#lbWho').textContent = p.a || 'Anonym';
  $('#lbWhen').textContent = ago(p.t) + ' · ' + (S.lbIndex + 1) + ' / ' + S.lbList.length;
  var L = S.liked[p.id] || {}, c = S.cfg;
  var bot = (c.reactions ? '<button class="pill' + (L.h ? ' on' : '') + '" data-r="h">♥ ' + (p.hr || '') + '</button><button class="pill' + (L.l ? ' on' : '') + '" data-r="l">😂 ' + (p.lr || '') + '</button>' : '') +
    (c.comments ? '<button class="pill" data-cm>💬 ' + (p.c || '') + '</button>' : '') +
    '<a class="pill" href="' + esc(IMG.dl(p.id)) + '" target="_blank" rel="noopener">⬇ Stáhnout</a>' +
    '<button class="pill" data-share aria-label="Sdílet">↗</button>' +
    (mySet[p.id] ? '' : '<button class="pill" data-report title="Nahlásit" aria-label="Nahlásit">⚑</button>');
  if (isAdmin()) bot += '<button class="pill acc" data-project>📽 Na plátno</button><button class="pill danger" data-adm="hide" data-id="' + p.id + '">Skrýt</button><button class="pill danger" data-adm="delete" data-id="' + p.id + '" aria-label="Smazat">🗑</button>';
  $('#lbBot').innerHTML = bot;
  [S.lbIndex + 1, S.lbIndex - 1].forEach(function (j) { var q = S.lbList[j]; if (q && !q._local) new Image().src = IMG.big(q.id); });
  if (sheet.classList.contains('show')) loadComments();
}
function stepLb(d) {
  var n = S.lbIndex + d;
  if (n < 0 || n >= S.lbList.length) { lbImg.style.transform = 'translateX(' + (d * -30) + 'px)'; setTimeout(function () { lbImg.style.transform = ''; }, 180); return; }
  S.lbIndex = n; showLb();
}
$('#lbClose').onclick = closeLb;
$('#lbPrev').onclick = function () { stepLb(-1); };
$('#lbNext').onclick = function () { stepLb(1); };
document.addEventListener('keydown', function (e) {
  if (lb.hidden || document.activeElement === $('#cmText')) return;
  if (e.key === 'Escape') { if (sheet.classList.contains('show')) closeSheet(); else closeLb(); }
  else if (e.key === 'ArrowLeft') stepLb(-1); else if (e.key === 'ArrowRight') stepLb(1);
});
(function () {
  var x0 = null, y0 = 0, st = $('#lbStage');
  st.addEventListener('touchstart', function (e) { if (e.touches.length > 1) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  st.addEventListener('touchmove', function (e) { if (x0 === null) return; lbImg.style.transform = 'translateX(' + (e.touches[0].clientX - x0) * .6 + 'px)'; }, { passive: true });
  st.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    lbImg.style.transform = ''; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) stepLb(dx < 0 ? 1 : -1);
    else if (dy > 120) closeLb();
  });
})();
$('#lbBot').addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t || t.hasAttribute('data-adm')) return;
  var p = curPhoto(); if (!p) return;
  if (t.hasAttribute('data-r')) {
    var k = t.getAttribute('data-r'), L = S.liked[p.id] || {}, on = !L[k], key = k === 'h' ? 'hr' : 'lr';
    L[k] = on; S.liked[p.id] = L; save('liked', S.liked);
    p[key] = Math.max(0, (p[key] || 0) + (on ? 1 : -1)); showLb();
    api('react', p.id, k, on ? 1 : -1).then(function (n) { p[key] = n; if (!lb.hidden && curPhoto() === p) showLb(); }).catch(function () {});
  } else if (t.hasAttribute('data-cm')) openSheet();
  else if (t.hasAttribute('data-share')) {
    var url = IMG.big(p.id);
    if (navigator.share) navigator.share({ title: S.cfg.title, url: url }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Odkaz na fotku zkopírován'); });
  } else if (t.hasAttribute('data-report')) {
    if (!confirm('Nahlásit tuto fotku jako nevhodnou?')) return;
    api('report', p.id).then(function () { toast('Díky, fotka nahlášena'); }).catch(function () {});
  } else if (t.hasAttribute('data-project')) screenCmd({ show: p.id });
});

/* comments */
function openSheet() { sheet.classList.add('show'); loadComments(); }
function closeSheet() { sheet.classList.remove('show'); }
$('#sheetClose').onclick = closeSheet;
function loadComments() {
  var p = curPhoto(); if (!p) return;
  $('#cmList').innerHTML = '<div class="empty small">Načítám…</div>';
  api('listComments', p.id).then(function (l) { if (curPhoto() === p) renderComments(l); }).catch(function () { $('#cmList').innerHTML = '<div class="empty small">Nepodařilo se načíst.</div>'; });
}
function renderComments(l) {
  var p = curPhoto(); if (!p) return;
  p.c = l.length;
  $('#cmList').innerHTML = l.length ? l.map(function (c) {
    return '<div class="cm"><b>' + esc(c.n || 'Anonym') + '</b><p>' + esc(c.x) + '</p><div class="meta"><span>' + ago(c.t) + '</span>' +
      (isAdmin() ? '<button data-delcm="' + esc(c.id) + '">Smazat</button>' : '') + '</div></div>';
  }).join('') : '<div class="empty small">Zatím žádný komentář. Napiš první!</div>';
  var b = $('#lbBot [data-cm]'); if (b) b.textContent = '💬 ' + (p.c || '');
}
$('#cmList').addEventListener('click', function (e) {
  var b = e.target.closest('[data-delcm]'); if (!b) return;
  adm('delComment', curPhoto().id, b.getAttribute('data-delcm')).then(renderComments);
});
$('#cmForm').onsubmit = function (e) {
  e.preventDefault();
  var inp = $('#cmText'), text = inp.value.trim(), p = curPhoto(); if (!text || !p) return;
  inp.disabled = true;
  api('addComment', p.id, { name: S.name, text: text }).then(function (l) { inp.value = ''; inp.disabled = false; if (curPhoto() === p) renderComments(l); })
    .catch(function (err) { inp.disabled = false; toast('Nepodařilo se: ' + errMsg(err)); });
};

/* ================================================================ data */
function merge(server) {
  var ids = {}; server.forEach(function (p) { ids[p.id] = 1; });
  var keep = S.photos.filter(function (p) { return p._local && !ids[p.id] && Date.now() - p.t < 120000; });
  server.forEach(function (p) { if (S.local[p.id]) p._local = 1; });
  var sig = function (l) { return l.map(function (p) { return p.id + ':' + p.hr + ':' + p.lr + ':' + p.c; }).join(); };
  var before = sig(S.photos);
  S.photos = keep.concat(server);
  return before !== sig(S.photos);
}

function poll() {
  return api('listPhotos').then(function (list) {
    if (merge(list) && lb.hidden) refresh();
    if (isAdmin() && S.view === 'admin') loadAdminData();
  }).catch(function () {});
}

function start() {
  render();
  api('init').then(function (d) {
    S.cfg = d.cfg; S.msgCount = d.messages; merge(d.photos);
    applyTheme();
    if (PARAMS.v === 'platno') return startScreen();
    if (PARAMS.v === 'qr') return startPrint();
    render();
    if (S.admin) adminLogin(S.admin, true);
    IDB.all().then(function (items) {
      if (!items || !items.length) return;
      items.forEach(function (it) { it.url = URL.createObjectURL(it.blob); it.tries = 0; S.queue.push(it); });
      S.total += items.length; pump();
    });
    setInterval(function () { if (!document.hidden) poll(); }, 20000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  }).catch(function (e) {
    $('#app').innerHTML = '<div class="wrap"><div class="card empty" style="margin-top:30vh"><div class="big">⚠️</div>Galerii se nepodařilo načíst.<br><span class="small">' + esc(errMsg(e)) + '</span><br><br><button class="btn btn-glass" onclick="location.reload()" style="margin:0 auto">Zkusit znovu</button></div></div>';
  });
}

/* ============================================================== plátno */
function startScreen() {
  document.body.style.overflow = 'hidden';
  $('#app').innerHTML = '<div class="screen" id="scr"><div class="layer" id="L0"></div><div class="layer" id="L1"></div>' +
    '<div class="hud"><span class="t grad">' + esc(S.cfg.title) + '</span><span class="n" id="cnt"></span></div>' +
    '<div class="cap" id="cap"></div>' +
    '<div class="corner" id="corner"><div class="q" id="scrQr"></div><div style="margin-top:.6vw">Přidej svou fotku</div></div>' +
    '<div class="controls"><button class="pill" id="sPause">⏸</button><button class="pill" id="sNext">⏭</button><button class="pill" id="sFull">⛶ Celá obrazovka</button></div>' +
    '<div class="wait" id="wait"><div><b class="grad">Naskenuj a foť</b><span>První fotka se objeví tady</span><br><div class="q" id="waitQr"></div></div></div></div>';
  qr($('#scrQr'), 220); qr($('#waitQr'), 320);
  var scr = $('#scr'), layers = [$('#L0'), $('#L1')], cur = 0, seen = {}, order = S.photos.slice(), pos = -1, fresh = [];
  var st = { paused: false, speed: 6, qr: true, next: 0, show: '', showAt: 0 }, lastNext = null, lastShow = null, timer = 0, hideCtl = 0;
  S.photos.forEach(function (p) { seen[p.id] = 1; });
  function counter() { $('#cnt').textContent = order.length + ' ' + plural(order.length, 'fotka', 'fotky', 'fotek'); }
  counter();

  function nextPhoto() {
    if (fresh.length) { var f = fresh.shift(); f._new = 1; return f; }
    if (!order.length) return null;
    pos = (pos + 1) % order.length;
    return order[pos];
  }
  function show(p) {
    if (!p) { $('#wait').style.display = 'grid'; $('#corner').style.display = 'none'; return; }
    $('#wait').style.display = 'none'; $('#corner').style.display = st.qr ? 'block' : 'none';
    var img = new Image();
    img.onload = function () {
      cur = 1 - cur;
      var L = layers[cur];
      L.innerHTML = '<div class="blur" style="background-image:url(\'' + img.src + '\')"></div>';
      L.appendChild(img);
      layers[1 - cur].classList.remove('on'); L.classList.add('on');
      $('#cap').innerHTML = (p._new ? '<span class="newb">NOVÁ FOTKA</span>' : '') + (p.a ? '📸 ' + esc(p.a) : '');
      p._new = 0;
    };
    img.onerror = function () { if (img.src.indexOf('lh3') > -1) img.src = IMG.bigAlt(p.id); else schedule(800); };
    img.src = IMG.big(p.id);
  }
  function tick() { if (!st.paused) show(nextPhoto()); schedule(); }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(tick, ms || st.speed * 1000); }
  tick();

  function pullPhotos() {
    api('listPhotos').then(function (list) {
      list.slice().reverse().forEach(function (p) { if (!seen[p.id]) { seen[p.id] = 1; fresh.push(p); } });
      var ids = {}; list.forEach(function (p) { ids[p.id] = 1; });
      order = list; fresh = fresh.filter(function (p) { return ids[p.id]; });
      if (pos >= order.length) pos = -1;
      counter();
      if ($('#wait').style.display !== 'none' && (fresh.length || order.length)) tick();
    }).catch(function () {});
  }
  function pullScreen() {
    api('getScreen').then(function (s) {
      var speedChanged = s.speed !== st.speed;
      st = s;
      $('#corner').style.display = st.qr && $('#wait').style.display === 'none' ? 'block' : 'none';
      $('#sPause').textContent = st.paused ? '▶' : '⏸';
      if (lastNext !== null && s.next !== lastNext) { show(nextPhoto()); schedule(); }
      if (lastShow !== null && s.showAt !== lastShow && s.show) {
        var p = order.filter(function (x) { return x.id === s.show; })[0] || { id: s.show, a: '' };
        show(p); schedule(Math.max(st.speed, 10) * 1000);
      }
      if (speedChanged) schedule();
      lastNext = s.next; lastShow = s.showAt;
    }).catch(function () {});
  }
  pullScreen();
  setInterval(pullPhotos, 10000);
  setInterval(pullScreen, 3000);

  scr.addEventListener('mousemove', showCtl); scr.addEventListener('click', showCtl);
  function showCtl() { scr.classList.add('ctl'); clearTimeout(hideCtl); hideCtl = setTimeout(function () { scr.classList.remove('ctl'); }, 3000); }
  $('#sPause').onclick = function (e) { e.stopPropagation(); st.paused = !st.paused; this.textContent = st.paused ? '▶' : '⏸'; };
  $('#sNext').onclick = function (e) { e.stopPropagation(); show(nextPhoto()); schedule(); };
  $('#sFull').onclick = function (e) { e.stopPropagation(); var d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d); };
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); $('#sPause').click(); } else if (e.key === 'ArrowRight') $('#sNext').click(); else if (e.key === 'f') $('#sFull').click();
  });
}

/* ============================================================ QR print */
function startPrint() {
  var c = S.cfg, cards = '';
  $('.bg').style.display = 'none';
  for (var i = 0; i < 6; i++) cards += '<div class="tcard"><div class="disp" style="font-size:20px">' + esc(c.title) + '</div><div class="q" id="tq' + i + '"></div><b>Naskenuj · Vyfoť · Hotovo</b><div style="font-size:12px;color:#666">Bez aplikace, bez registrace</div></div>';
  $('#app').innerHTML = '<div class="print"><div class="toolbar"><button onclick="window.print()">🖨 Vytisknout</button><button id="dlPng">⬇ Stáhnout QR (PNG)</button></div>' +
    '<div class="poster"><div style="letter-spacing:.3em;font-size:12px;text-transform:uppercase;opacity:.7">Sdílená galerie</div><h1>' + esc(c.title) + '</h1>' +
    (c.subtitle ? '<div style="font-size:17px;opacity:.8">' + esc(c.subtitle) + '</div>' : '') +
    '<div class="big-q" id="bigQ"></div><div class="steps">1. Naskenuj &nbsp;·&nbsp; 2. Vyfoť &nbsp;·&nbsp; 3. Hotovo</div>' +
    '<p style="opacity:.75;margin-bottom:0">Bez aplikace, bez registrace. Všechny fotky uvidíte v galerii i na plátně.</p></div>' +
    '<div class="cards">' + cards + '</div></div>';
  qr($('#bigQ'), 600);
  for (var j = 0; j < 6; j++) qr($('#tq' + j), 300);
  $('#dlPng').onclick = function () {
    var cv = $('#bigQ canvas'), im = $('#bigQ img');
    if (cv) cv.toBlob(function (b) { download(b, 'qr-galerie.png'); });
    else if (im) window.open(im.src, '_blank');
  };
}

start();
})();
</script>
